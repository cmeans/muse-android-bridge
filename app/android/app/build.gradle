import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = 'com.intfar.mabridge'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.intfar.mabridge'
        minSdk = 29
        targetSdk = 36
        versionCode = 2
        versionName = '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // org.json is an Android stub on the JVM; tests need the real one.
    testImplementation 'org.json:json:20250517'
}

// ManifestQueriesTest and ReleaseNetworkTest read these files directly, so
// they're declared as inputs: changing one re-runs the unit tests instead of
// leaving testDebugUnitTest UP-TO-DATE.
tasks.withType(Test).configureEach {
    inputs.files(fileTree('src') { include '*/AndroidManifest.xml', '*/res/xml/*.xml' })
        .withPropertyName('manifestAndNetworkFiles')
}
