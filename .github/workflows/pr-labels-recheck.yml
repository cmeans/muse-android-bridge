name: PR Label Recheck

# Ported from mcp-phone-commands (its main at 524646e): a bare #N in this file is
# mcp-phone-commands #N, not this repo's.

# A green PR can strand on Awaiting CI when GitHub's listings lag behind the last CI event,
# since no later event checks again (mcp-synology #549 and #339), and CodeQL can fail after a
# PR is promoted, with no event at all (mcp-synology #578). This checks on a schedule, with the same script as
# pr-labels-ci.yml. See .github/scripts/pr-labels-recheck.sh.
#
# LIMITATION: schedule runs from the default branch (main), so changes to this file take effect only
# after merge. GitHub can delay a scheduled run.
on:
  schedule:
    # Every 4 hours here (mcp-phone-commands: hourly). This repo is private, so each run
    # bills at least a minute from the account's included Actions minutes, a pool shared
    # with the account's other private repos (mcp-phone-commands' hourly recheck among
    # them): every 4 hours is about 180 minutes a month.
    - cron: "17 */4 * * *"
  workflow_dispatch:

# No token permissions by default; the job asks only for what it uses (mcp-synology #203).
permissions: {}

jobs:
  recheck:
    if: github.repository == 'cmeans/muse-android-bridge'
    runs-on: ubuntu-latest
    # A hung call mustn't hold the concurrency group below for hours.
    timeout-minutes: 15
    # A run that outlasts the interval shouldn't overlap the next.
    concurrency:
      group: pr-labels-recheck
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recheck labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/pr-labels-recheck.sh
