name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token for every job: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # NOTE: pr-labels-ci.yml triggers on this workflow by name ("CI"), and
  # .github/scripts/pr-checks-state.sh judges it by file (ci.yml), every job
  # of it. If either is renamed, update them too.
  # The job names ("android", "workflows") are meant to be required checks in
  # main's ruleset: if one is renamed, update the ruleset, or every PR waits
  # on a check that never comes.

  # The label and QA Gate workflow scripts against a fake gh (tests/workflows,
  # ported from mcp-phone-commands), on whatever jq and yq ubuntu-latest has,
  # since the workflows run on them too.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Workflow tests
        run: bash tests/run.sh

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # gradle-wrapper.jar is committed: check it is a real Gradle release
      # before anything runs it.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # Gradle comes from the wrapper (gradle-wrapper.properties); this only
      # adds caching. The cache is written on main only. cache-provider basic:
      # the default ("enhanced") is a commercial service that is only a free
      # preview for private repositories like this one.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Debug build
        run: ./gradlew assembleDebug
      - name: Lint
        # Fails on lint errors only; warnings are reported, not fatal.
        run: ./gradlew lintDebug
